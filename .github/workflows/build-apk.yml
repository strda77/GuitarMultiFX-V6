name: Build Guitar Multi FX V7 APK

on:
  workflow_dispatch:
  push:
    paths:
      - "GuitarMultiFX-V7-Final.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check V7 ZIP
        run: |
          test -f GuitarMultiFX-V7-Final.zip
          echo "V7 ZIP ditemukan."

      - name: Extract V7 project
        run: |
          rm -rf v7_project
          mkdir -p v7_project
          unzip -q GuitarMultiFX-V7-Final.zip -d v7_project

          echo "Isi hasil ekstraksi:"
          find v7_project -maxdepth 3 -type f | head -100

      - name: Locate Android project
        run: |
          if [ -f "v7_project/settings.gradle" ] || [ -f "v7_project/settings.gradle.kts" ]; then
            echo "PROJECT_DIR=v7_project" >> "$GITHUB_ENV"
          else
            PROJECT_DIR=$(find v7_project -name settings.gradle -o -name settings.gradle.kts | head -1 | xargs dirname)
            test -n "$PROJECT_DIR"
            echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Make Gradle executable
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          else
            echo "gradlew tidak ditemukan."
            exit 1
          fi

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: Find APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          find . -type f -name "*.apk" -print

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GuitarMultiFX-V7-APK
          path: ${{ env.PROJECT_DIR }}/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
