
name: GuitarMultiFX V7 Build

on:
  workflow_dispatch:
  push:
    paths:
      - "GuitarMultiFX-V7-Final.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check and Extract ZIP
        run: |
          set -e
          test -f GuitarMultiFX-V7-Final.zip
          unzip -t GuitarMultiFX-V7-Final.zip
          mkdir v7_project
          unzip -q GuitarMultiFX-V7-Final.zip -d v7_project

          echo "=== FILE DALAM ZIP ==="
          find v7_project -maxdepth 6 -type f | sort | head -300

          echo "=== GRADLE FILES ==="
          find v7_project -type f \( \
            -name settings.gradle \
            -o -name settings.gradle.kts \
            -o -name build.gradle \
            -o -name build.gradle.kts \
            -o -name gradlew \
          \) -print

      - name: Find Android Project
        shell: bash
        run: |
          set -e
          FILE=$(find "$GITHUB_WORKSPACE/v7_project" \
            -type f \( -name settings.gradle \
            -o -name settings.gradle.kts \) \
            -print -quit)

          if [ -z "$FILE" ]; then
            echo "ERROR: Konfigurasi proyek Gradle tidak ditemukan."
            exit 1
          fi

          echo "PROJECT_DIR=$(dirname "$FILE")" >> "$GITHUB_ENV"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate Android SDK
        shell: bash
        run: |
          set -e
          SDKMANAGER="$(command -v sdkmanager || true)"

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools \
              -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager tidak ditemukan."
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "SDK manager: $SDKMANAGER"
          "$SDKMANAGER" --version

      - name: Install Android SDK
        run: |
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Check Gradle Wrapper
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ ! -f gradlew ]; then
            echo "ERROR: File gradlew tidak ditemukan."
            ls -la
            exit 1
          fi

          chmod +x gradlew
          ./gradlew --version

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GuitarMultiFX-V7-APK
          path: ${{ env.PROJECT_DIR }}/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
